name: Android release (AAB)

on:
  workflow_dispatch:
  push:
    branches: [main, play-update-v1.2]
    tags: ['v*']

permissions:
  contents: write   # to publish the test APK as a pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Add google-services.json (optional, enables push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_ENABLE_PUSH=true" >> "$GITHUB_ENV"
            echo "Push notifications enabled"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without push notifications"
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: AAB will be UNSIGNED and Play will reject it"
          fi

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon --stacktrace

      - name: Show signing certificate
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256" || echo "AAB is unsigned"

      - uses: actions/upload-artifact@v4
        with:
          name: showmine-tv-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: showmine-tv-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish test APK as a pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "showmine-tv-test-${GITHUB_RUN_NUMBER}.apk"
          gh release create "$TAG" "showmine-tv-test-${GITHUB_RUN_NUMBER}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Test APK from ${GITHUB_SHA::7}. Installs as 'Showmine TV' next to the Play Store app (package com.showminetventertainment.showminetv.test). Not for Play upload."
